global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: neatsprint

scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ["gateway:8080"]

  - job_name: services
    static_configs:
      - targets:
          - "iam:8000"
          - "core:8000"
          - "task:8000"
          - "team:8000"
          - "worklog:8000"
          - "monitoring:8000"
          - "chat:8000"
          - "reports:8000"
          - "ai:8000"
        labels:
          component: service

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
