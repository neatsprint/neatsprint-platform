name: ${COMPOSE_PROJECT_NAME:-neatsprint}

x-app: &app
  restart: unless-stopped
  networks: [neatsprint]
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

x-healthcheck: &healthcheck
  interval: 20s
  timeout: 3s
  start_period: 25s
  retries: 5
  test:
    - CMD
    - python
    - -c
    - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [neatsprint]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-neatsprint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neatsprint}
      POSTGRES_DB: ${POSTGRES_DB:-neatsprint}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-neatsprint} -d ${POSTGRES_DB:-neatsprint}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [neatsprint]
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: bitnamilegacy/minio:latest
    restart: unless-stopped
    networks: [neatsprint]
    # Local development only: the named volume is root-owned; production uses a
    # properly owned PVC and a non-root security context.
    user: "0:0"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-neatsprint}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-neatsprint-dev-secret}
      # The image creates this bucket on first start (private by default), so no
      # separate init container is needed.
      MINIO_DEFAULT_BUCKETS: ${MINIO_BUCKET:-neatsprint}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    networks: [neatsprint]
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"

  gateway:
    image: traefik:v3.3
    restart: unless-stopped
    networks: [neatsprint]
    command: ["--configFile=/etc/traefik/traefik.yml"]
    ports:
      - "${GATEWAY_HTTP_PORT:-8000}:80"
      - "${GATEWAY_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - ./services/neatsprint-apigw/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./services/neatsprint-apigw/dynamic:/etc/traefik/dynamic:ro

  neatsprint-iam:
    <<: *app
    build:
      context: ./services/neatsprint-iam
    environment:
      SERVICE_NAME: iam
      ENVIRONMENT: local
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-neatsprint}:${POSTGRES_PASSWORD:-neatsprint}@postgres:5432/db_iam
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:${WEB_PORT:-3000}
      AUTH_ENABLED: "true"
      JWKS_URL: http://neatsprint-iam:8000/api/v1/auth/.well-known/jwks.json
      JWT_ISSUER: ${JWT_ISSUER:-neatsprint-iam}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-neatsprint}
      JWT_PRIVATE_KEY_PATH: /keys/jwt-private.pem
      JWT_PUBLIC_KEY_PATH: /keys/jwt-public.pem
      ACCESS_TOKEN_MINUTES: "15"
      REFRESH_TOKEN_DAYS: "7"
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:-dev-bootstrap-token-change-me}
      RUN_MIGRATIONS: "true"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: "NeatSprint <no-reply@neatsprint.local>"
      EMAIL_ENABLED: "true"
      WEB_BASE_URL: http://localhost:${WEB_PORT:-3000}
    ports:
      - "${IAM_PORT:-8001}:8000"
    volumes:
      - ./infra/keys:/keys
    healthcheck: *healthcheck

  neatsprint-core:
    <<: *app
    build:
      context: ./services/neatsprint-core
    environment:
      SERVICE_NAME: core
      ENVIRONMENT: local
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-neatsprint}:${POSTGRES_PASSWORD:-neatsprint}@postgres:5432/db_core
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:${WEB_PORT:-3000}
      AUTH_ENABLED: "true"
      JWKS_URL: http://neatsprint-iam:8000/api/v1/auth/.well-known/jwks.json
      JWT_ISSUER: ${JWT_ISSUER:-neatsprint-iam}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-neatsprint}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:-dev-bootstrap-token-change-me}
      RUN_MIGRATIONS: "true"
    ports:
      - "${CORE_PORT:-8002}:8000"
    healthcheck: *healthcheck

  neatsprint-task:
    <<: *app
    build:
      context: ./services/neatsprint-task
    environment:
      SERVICE_NAME: task
      ENVIRONMENT: local
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-neatsprint}:${POSTGRES_PASSWORD:-neatsprint}@postgres:5432/db_task
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:${WEB_PORT:-3000}
      AUTH_ENABLED: "true"
      JWKS_URL: http://neatsprint-iam:8000/api/v1/auth/.well-known/jwks.json
      JWT_ISSUER: ${JWT_ISSUER:-neatsprint-iam}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-neatsprint}
    ports:
      - "${TASK_PORT:-8003}:8000"
    healthcheck: *healthcheck

  neatsprint-team:
    <<: *app
    build:
      context: ./services/neatsprint-team
    environment:
      SERVICE_NAME: team
      ENVIRONMENT: local
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-neatsprint}:${POSTGRES_PASSWORD:-neatsprint}@postgres:5432/db_team
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:${WEB_PORT:-3000}
      AUTH_ENABLED: "true"
      JWKS_URL: http://neatsprint-iam:8000/api/v1/auth/.well-known/jwks.json
      JWT_ISSUER: ${JWT_ISSUER:-neatsprint-iam}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-neatsprint}
    ports:
      - "${TEAM_PORT:-8004}:8000"
    healthcheck: *healthcheck

  neatsprint-worklog:
    <<: *app
    build:
      context: ./services/neatsprint-worklog
    environment:
      SERVICE_NAME: worklog
      ENVIRONMENT: local
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-neatsprint}:${POSTGRES_PASSWORD:-neatsprint}@postgres:5432/db_worklog
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:${WEB_PORT:-3000}
      AUTH_ENABLED: "true"
      JWKS_URL: http://neatsprint-iam:8000/api/v1/auth/.well-known/jwks.json
      JWT_ISSUER: ${JWT_ISSUER:-neatsprint-iam}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-neatsprint}
    ports:
      - "${WORKLOG_PORT:-8005}:8000"
    healthcheck: *healthcheck

  neatsprint-monitoring:
    <<: *app
    build:
      context: ./services/neatsprint-monitoring
    environment:
      SERVICE_NAME: monitoring
      ENVIRONMENT: local
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-neatsprint}:${POSTGRES_PASSWORD:-neatsprint}@postgres:5432/db_monitoring
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:${WEB_PORT:-3000}
      AUTH_ENABLED: "true"
      JWKS_URL: http://neatsprint-iam:8000/api/v1/auth/.well-known/jwks.json
      JWT_ISSUER: ${JWT_ISSUER:-neatsprint-iam}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-neatsprint}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${MINIO_BUCKET:-neatsprint}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-neatsprint}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-neatsprint-dev-secret}
    ports:
      - "${MONITORING_PORT:-8006}:8000"
    healthcheck: *healthcheck

  neatsprint-chat:
    <<: *app
    build:
      context: ./services/neatsprint-chat
    environment:
      SERVICE_NAME: chat
      ENVIRONMENT: local
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-neatsprint}:${POSTGRES_PASSWORD:-neatsprint}@postgres:5432/db_chat
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:${WEB_PORT:-3000}
      AUTH_ENABLED: "true"
      JWKS_URL: http://neatsprint-iam:8000/api/v1/auth/.well-known/jwks.json
      JWT_ISSUER: ${JWT_ISSUER:-neatsprint-iam}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-neatsprint}
    ports:
      - "${CHAT_PORT:-8007}:8000"
    healthcheck: *healthcheck

  neatsprint-reports:
    <<: *app
    build:
      context: ./services/neatsprint-reports
    environment:
      SERVICE_NAME: reports
      ENVIRONMENT: local
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-neatsprint}:${POSTGRES_PASSWORD:-neatsprint}@postgres:5432/db_reports
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:${WEB_PORT:-3000}
      AUTH_ENABLED: "true"
      JWKS_URL: http://neatsprint-iam:8000/api/v1/auth/.well-known/jwks.json
      JWT_ISSUER: ${JWT_ISSUER:-neatsprint-iam}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-neatsprint}
    ports:
      - "${REPORTS_PORT:-8008}:8000"
    healthcheck: *healthcheck

  neatsprint-ai:
    <<: *app
    build:
      context: ./services/neatsprint-ai
    environment:
      SERVICE_NAME: ai
      ENVIRONMENT: local
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-neatsprint}:${POSTGRES_PASSWORD:-neatsprint}@postgres:5432/db_ai
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:${WEB_PORT:-3000}
      AUTH_ENABLED: "true"
      JWKS_URL: http://neatsprint-iam:8000/api/v1/auth/.well-known/jwks.json
      JWT_ISSUER: ${JWT_ISSUER:-neatsprint-iam}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-neatsprint}
      LLM_PROVIDER: stub
    ports:
      - "${AI_PORT:-8009}:8000"
    healthcheck: *healthcheck

  neatsprint-web:
    restart: unless-stopped
    networks: [neatsprint]
    build:
      context: ./services/neatsprint-web
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
      API_INTERNAL_URL: http://gateway/api/v1
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "${WEB_PORT:-3000}:3000"

  prometheus:
    image: prom/prometheus:latest
    profiles: [observability]
    restart: unless-stopped
    networks: [neatsprint]
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    profiles: [observability]
    restart: unless-stopped
    networks: [neatsprint]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

networks:
  neatsprint:
    name: neatsprint

volumes:
  pgdata:
  redisdata:
  miniodata:
