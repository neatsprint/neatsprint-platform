name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - iam
          - core
          - task
          - team
          - worklog
          - monitoring
          - reports
          - ai
          - chat
          - web
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: services/neatsprint-${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/neatsprint/neatsprint-${{ matrix.service }}:${{ github.ref_name }}
            ghcr.io/neatsprint/neatsprint-${{ matrix.service }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/neatsprint/neatsprint-platform
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/neatsprint/neatsprint-${{ matrix.service }}:${{ github.ref_name }}
          artifact-name: sbom-${{ matrix.service }}.spdx.json
          format: spdx-json

      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/neatsprint/neatsprint-${{ matrix.service }}:${{ github.ref_name }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
